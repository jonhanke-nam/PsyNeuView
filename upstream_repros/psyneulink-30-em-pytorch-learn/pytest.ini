[pytest]
# Make this folder its own pytest rootdir so it never inherits a parent
# config, and register the custom markers the vendored upstream EGO test uses
# (otherwise pytest emits PytestUnknownMarkWarning for them).
markers =
    model: upstream PsyNeuLink marker (vendored test_giallanza_ego_upstream.py)
    pytorch: upstream PsyNeuLink marker (vendored test_giallanza_ego_upstream.py)
