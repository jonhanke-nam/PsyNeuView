[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psyneuview"
version = "0.6.16"
description = "Web-first graphical interface for PsyNeuLink"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "psyneulink",
    "watchdog>=4.0.0",
    # The live preview's fast check for undefined names (#256).
    "pyflakes>=3.2",
    # PsyNeuView's MCP server for Claude Desktop and Claude Code (#201): app/mcp_server.py.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",  # CI runs the suite in parallel (#1250)
    "ruff>=0.3.0",
]

[project.scripts]
# The MCP server Claude Desktop or Claude Code launches (#201); same as `python -m app.mcp_server`.
psyneuview-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["app*"]
