[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psyneuview"
version = "0.6.16"
description = "Web-first graphical interface for PsyNeuLink"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "psyneulink",
    "watchdog>=4.0.0",
    # The live preview's fast check for undefined names (#256).
    "pyflakes>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # line and branch coverage for docs/testing-coverage.md (#319)
    "pytest-xdist>=3.5",  # CI runs the suite in parallel (#1250)
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Coverage for docs/testing-coverage.md (#319). Run from backend/:
#   pytest tests -n auto --cov --cov-report=json:coverage.json
# `patch = subprocess` also measures the sandbox worker processes, where
# models actually load and run.
[tool.coverage.run]
source = ["app"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true
