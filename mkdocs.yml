site_name: PsyNeuView documentation
site_description: >-
  Documentation for PsyNeuView — a GUI for building, running, and visualizing
  PsyNeuLink models.
repo_url: https://github.com/jonhanke-nam/PsyNeuView
repo_name: jonhanke-nam/PsyNeuView
# The existing in-repo markdown is the canonical source; this site is a thin,
# non-disruptive layer over it (#736). GitHub still renders the same files.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  # Collapsible "Advanced" notes — the progressive-disclosure approach from #733.
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true

# Diátaxis-aligned sections (#733): Tutorials (learning) up front; the technical
# notes grouped under Developer. How-to / Explanation sections come later.
nav:
