  - PyCharm setup (macOS): guides/pycharm-setup-macos.md
  - Existing PsyNeuLink setup: guides/existing-psyneulink-setup.md
  - Hosted instance (demo): guides/hosted-instance.md
  - Where PsyNeuView keeps things: where-things-live.md
  - What you can edit, and why: what-you-can-edit.md
