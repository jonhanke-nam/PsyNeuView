name: Docs drift guard

# Guard that docs/testing.md stays in sync with the CI workflows (#826): checks
# the PsyNeuLink pin and the gate-workflow list. Runs on every merge to `devel`
# — GitHub's schedule/cron only fires from the default branch (`main`), not the
# `devel` trunk, so push-on-devel is the reliable trigger. Also runnable on
# demand. On drift it opens (or comments on) a tracking issue and fails the run.
#
# Also guards `feature/tutorials`, the tutorial integration branch (#1180).
# That work is docs-heavy, so drift is exactly what accumulates there — and
# catching it per-slice beats finding a branch's worth at the merge into devel.

on:
  push:
    branches: [devel, feature/tutorials]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/testing.md against workflows
        id: check
        run: |
          if python3 scripts/docs_drift_check.py | tee drift.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Docs drift: docs/testing.md out of sync (weekly guard)"
          body="$(printf 'The weekly docs-drift guard found docs/testing.md out of sync with the CI workflows:\n\n```\n%s\n```\n\nUpdate docs/testing.md (see its "Keeping this doc current" section). Part of the periodic docs review (#826).' "$(cat drift.txt)")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title Docs drift: docs/testing.md out of sync" \
            --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label process --label documentation --body "$body"
          fi

      - name: Fail if drift detected
        if: steps.check.outputs.drift == 'true'
        run: exit 1
