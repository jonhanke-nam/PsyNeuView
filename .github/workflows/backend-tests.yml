name: Backend tests

# Runs the backend pytest suite (backend/tests) on every PR to devel and devel
# push that touches backend code. Part of the automated-testing footprint
# (umbrella #652); this is the activation of the manual scaffold from #700, per
# #654. The reference-model equivalence tests (PsyNeuView executor output ==
# stock PsyNeuLink) ride along here.

on:
  # No path filter on triggers (so the `backend pytest` check is always
  # reported for branch protection); the `changes` job decides whether the
  # suite runs. A skipped job counts as passing — unrelated PRs don't deadlock.

  # `feature/tutorials` deliberately does NOT gate here. This suite costs
  # ~26-29 min per Python version per run in CI and ~2.4 min locally -- the difference is almost all
  # PsyNeuLink install -- so a slice author runs it locally and CI runs it once,
  # at the PR from feature/tutorials into devel, against everything accumulated.
  # Actions spend on this account is capped with stop-usage on (#991).
  # The cheap tier (typecheck + vitest) still gates every slice.
  push:
    branches: [devel, devel-unsafe]
  pull_request:
    branches: [devel, devel-unsafe]
  workflow_dispatch: {}

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hook-capable PsyNeuLink (PrincetonUniversity @ jonhanke-dev) — matches the
  # shipped app and the tutorials CI, so hook-dependent tests (debugger
  # snapshots, autodiff observability) behave as in production. e2e.yml still
  # pins the stock ref; reconcile when its triggers activate (#168).
  PSYNEULINK_GIT_REF: b0a750db14f0e18f13f4af6d4228e5824a7f2797
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.f.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          PATTERN: '^(backend/|scripts/|\.github/workflows/backend-tests\.yml)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `github.sha` is the auto-generated merge commit, and its FIRST
            # parent is the base branch as it stands *now*. Use that.
            #
            # `pull_request.base.sha` is the base as it was when the PR was
            # opened, so diffing from it also sweeps up everything the base
            # gained since -- #989. A one-line docs PR (#1184) ran tutorials,
            # e2e and both pytest variants because devel had moved under it:
            # the diff reported five frontend/workflow files the PR never
            # touched. The merge-base call below cannot save us there, because
            # the merge commit descends from the stale base, so the merge base
            # *is* the stale base.
            base="$(git rev-parse "${{ github.sha }}^1" 2>/dev/null || true)"
            # An unmergeable PR has no merge commit -> fall back to the
            # recorded base rather than skipping.
            [ -n "$base" ] || base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif mb="$(git merge-base "$base" "${{ github.sha }}" 2>/dev/null)"; [ -z "$mb" ]; then
            # merge base unresolvable -> fail safe by running, never by skipping
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$mb" "${{ github.sha }}" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: backend pytest
    needs: changes
    # #991: `!= 'false'` rather than `== 'true'`, so this gate only skips when
    # `changes` actually decided the paths were irrelevant. If `changes` dies
    # (it failed to even start during the 2026-08-25 Actions billing outage),
    # `run` is empty and this job runs — and a required check that fails blocks
    # the merge, where a skipped one silently satisfies branch protection.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # 60: the suite ran 25–29 min in late September (limit raised 30 → 45,
    # #1250) and 34–46 min by 12 October, when two 3.14 runs were cancelled at
    # 91% with every test passing. Headroom while the slow tests are found.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PsyNeuLink pulls torch, whose default wheel bundles multi-GB CUDA
      # libraries that exhaust the runner's root disk ([Errno 28]). Reclaim
      # space before installing.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        # #1368: no `cache: pip`. PsyNeuLink pulls torch and its CUDA wheels, so
        # the pip cache is ~2.8 GB, and its key (a hash of pyproject.toml) moves
        # with every version bump, so each PR saved another copy. Three of them
        # filled the repo's 10 GB Actions cache and evicted the Playwright browser
        # cache. Restoring it already took 30-60 s a job, so downloading the
        # wheels instead should cost little. See docs/testing.md.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install PsyNeuLink from the pinned SHA first so the editable backend
      # install doesn't pull whatever PyPI happens to have.
      - name: Create venv + install PsyNeuLink (pinned, hook-capable)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip wheel
          backend/.venv/bin/pip install "git+https://github.com/PrincetonUniversity/PsyNeuLink.git@${PSYNEULINK_GIT_REF}"

      # [dev] pulls pytest + pytest-asyncio (the base install doesn't).
      - name: Install backend with test deps
        run: backend/.venv/bin/pip install -e "backend/[dev]"

      - name: Run backend tests
        working-directory: backend
        # In parallel across the runner's cores (-n auto, 4 on ubuntu-latest),
        # and list the 30 slowest tests so where the time goes is visible in
        # every run (#1250). Serial, the suite ran 25-29 min against a 30-min
        # limit.
        run: .venv/bin/python -m pytest tests -q -ra -n auto --durations=30

  # 3.14 run (#979). Kept as its own job rather than a matrix on backend-tests:
  # a matrix would rename that check to "backend pytest (3.13)" and the
  # required-check config on devel would stop seeing it, blocking every PR.
  #
  # This check IS required on devel. Its name is part of that branch-protection
  # config, so renaming the job silently blocks every PR — the required context
  # would stop reporting. Change the protection config first if you rename it.
  backend-tests-314:
    name: backend pytest (3.14)
    needs: changes
    # #991: `!= 'false'` rather than `== 'true'`, so this gate only skips when
    # `changes` actually decided the paths were irrelevant. If `changes` dies
    # (it failed to even start during the 2026-08-25 Actions billing outage),
    # `run` is empty and this job runs — and a required check that fails blocks
    # the merge, where a skipped one silently satisfies branch protection.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # 60: the suite ran 25–29 min in late September (limit raised 30 → 45,
    # #1250) and 34–46 min by 12 October, when two 3.14 runs were cancelled at
    # 91% with every test passing. Headroom while the slow tests are found.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        # #1368: no `cache: pip`. PsyNeuLink pulls torch and its CUDA wheels, so
        # the pip cache is ~2.8 GB, and its key (a hash of pyproject.toml) moves
        # with every version bump, so each PR saved another copy. Three of them
        # filled the repo's 10 GB Actions cache and evicted the Playwright browser
        # cache. Restoring it already took 30-60 s a job, so downloading the
        # wheels instead should cost little. See docs/testing.md.
        with:
          python-version: "3.14"

      - name: Create venv + install PsyNeuLink (pinned, hook-capable)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip wheel
          backend/.venv/bin/pip install "git+https://github.com/PrincetonUniversity/PsyNeuLink.git@${PSYNEULINK_GIT_REF}"

      - name: Install backend with test deps
        run: backend/.venv/bin/pip install -e "backend/[dev]"

      - name: Run backend tests
        working-directory: backend
        # In parallel across the runner's cores (-n auto, 4 on ubuntu-latest),
        # and list the 30 slowest tests so where the time goes is visible in
        # every run (#1250). Serial, the suite ran 25-29 min against a 30-min
        # limit.
        run: .venv/bin/python -m pytest tests -q -ra -n auto --durations=30
