name: E2E

# Broader Playwright E2E suite (the non-tutorial app/feature specs; tutorials
# run in tutorials.yml).
#
# Per the #168 activation plan, this auto-runs a *curated set of currently-green*
# specs (`npm run test:e2e:ci`) on PRs to devel — the first increment. Specs not
# yet green are excluded from the gate and tracked for fixing. A spec joins the
# set by carrying the Playwright tag `@ci` (and its file is listed in
# frontend/e2e/ci-specs.txt, which a vitest checks). The full / smoke sets remain
# available via manual "Run workflow".

on:
  # No path filter on triggers (so the `e2e` check is always reported for
  # branch protection); the `changes` job decides whether the curated suite
  # runs. A skipped job counts as passing — unrelated PRs don't deadlock. A
  # manual run can't diff, so it falls through to running (smoke/full).

  # `feature/tutorials` deliberately does NOT gate here. This suite costs
  # ~17 min per run in CI and ~2.4 min locally -- the difference is almost all
  # PsyNeuLink install -- so a slice author runs it locally and CI runs it once,
  # at the PR from feature/tutorials into devel, against everything accumulated.
  # Actions spend on this account is capped with stop-usage on (#991).
  # The cheap tier (typecheck + vitest) still gates every slice.
  push:
    branches: [devel, devel-unsafe]
  pull_request:
    branches: [devel, devel-unsafe]
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode (manual runs)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hook-capable PsyNeuLink (PrincetonUniversity @ jonhanke-dev) — matches the
  # app and the other CI workflows, and the build the curated specs were
  # validated against.
  PSYNEULINK_GIT_REF: b0a750db14f0e18f13f4af6d4228e5824a7f2797
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.f.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          # #1012 taught us the filter has to cover what e2e *asserts on*, not
          # just what it is written in. A reference-model sidecar change skipped
          # e2e entirely, so a layout edit landed on devel having broken
          # stroop-lc-reference — invisible until the next frontend PR ran.
          PATTERN: '^(frontend/|backend/reference_models/|\.github/workflows/e2e\.yml)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `github.sha` is the auto-generated merge commit, and its FIRST
            # parent is the base branch as it stands *now*. Use that.
            #
            # `pull_request.base.sha` is the base as it was when the PR was
            # opened, so diffing from it also sweeps up everything the base
            # gained since -- #989. A one-line docs PR (#1184) ran tutorials,
            # e2e and both pytest variants because devel had moved under it:
            # the diff reported five frontend/workflow files the PR never
            # touched. The merge-base call below cannot save us there, because
            # the merge commit descends from the stale base, so the merge base
            # *is* the stale base.
            base="$(git rev-parse "${{ github.sha }}^1" 2>/dev/null || true)"
            # An unmergeable PR has no merge commit -> fall back to the
            # recorded base rather than skipping.
            [ -n "$base" ] || base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif mb="$(git merge-base "$base" "${{ github.sha }}" 2>/dev/null)"; [ -z "$mb" ]; then
            # merge base unresolvable -> fail safe by running, never by skipping
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$mb" "${{ github.sha }}" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e
    needs: changes
    # #991: `!= 'false'` rather than `== 'true'`, so this gate only skips when
    # `changes` actually decided the paths were irrelevant. If `changes` dies
    # (it failed to even start during the 2026-08-25 Actions billing outage),
    # `run` is empty and this job runs — and a required check that fails blocks
    # the merge, where a skipped one silently satisfies branch protection.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PsyNeuLink pulls torch, whose default wheel bundles multi-GB CUDA
      # libraries that exhaust the runner's root disk ([Errno 28]).
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        # #1368: no `cache: pip`. PsyNeuLink pulls torch and its CUDA wheels, so
        # the pip cache is ~2.8 GB, and its key (a hash of pyproject.toml) moves
        # with every version bump, so each PR saved another copy. Three of them
        # filled the repo's 10 GB Actions cache and evicted the Playwright browser
        # cache. Restoring it already took 30-60 s a job, so downloading the
        # wheels instead should cost little. See docs/testing.md.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Create backend/.venv at the path playwright.config.ts expects, with
      # PsyNeuLink from the pinned hook-capable SHA installed first.
      - name: Create backend venv + install PsyNeuLink (pinned, hook-capable)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip wheel
          backend/.venv/bin/pip install "git+https://github.com/PrincetonUniversity/PsyNeuLink.git@${PSYNEULINK_GIT_REF}"

      - name: Install backend (editable)
        run: backend/.venv/bin/pip install -e backend/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # #931: the browser install used to hang on apt and burn the whole job
      # timeout. System deps (apt) and the browser download are now separate
      # steps, each bounded per attempt and retried; a cache hit skips only
      # the download. apt gets network timeouts so a stalled mirror errors out
      # instead of hanging.
      - name: Restore Playwright browsers cache
        id: pw-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright system deps (bounded, retried)
        working-directory: frontend
        timeout-minutes: 12
        run: |
          # #59: apt waits up to 60 s for the dpkg lock instead of failing at once.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "60";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network-timeouts
          for attempt in 1 2; do
            timeout --kill-after=15 300 npx playwright install-deps chromium && exit 0
            echo "::warning::Playwright install-deps attempt $attempt failed or timed out"
            # #59: timeout stops npx, but the apt-get it started under sudo
            # keeps running and holds the dpkg lock, so the retry could never
            # install. Stop it before retrying.
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Download Playwright browsers (bounded, retried)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=15 120 npx playwright install chromium && exit 0
            echo "::warning::Playwright browser download attempt $attempt failed or timed out"
          done
          exit 1

      # Saved straight after the download, not in a post-job step, so a job
      # that later fails or is cancelled still leaves the cache for next time.
      - name: Save Playwright browsers cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Run E2E tests
        working-directory: frontend
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "full" ]; then
              npm run test:e2e
            else
              npm run test:e2e:smoke
            fi
          else
            # Auto-trigger: the curated green non-tutorial specs, tagged @ci (#168 increment).
            npm run test:e2e:ci
          fi

      # Traces, videos, screenshots from on-first-retry. 14d retention.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
