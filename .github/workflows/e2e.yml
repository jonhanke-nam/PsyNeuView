name: E2E

# Broader Playwright E2E suite (the non-tutorial app/feature specs; tutorials
# run in tutorials.yml).
#
# Per the #168 activation plan, this auto-runs a *curated set of currently-green*
# specs (`npm run test:e2e:ci`) on PRs to devel — the first increment. Specs not
# yet green are excluded from the gate and tracked for fixing. A spec joins the
# set by carrying the Playwright tag `@ci` (and its file is listed in
# frontend/e2e/ci-specs.txt, which a vitest checks). The full / smoke sets remain
# available via manual "Run workflow".
#
# #295: the suite runs as 3 parallel shards (Playwright `--shard=N/3`), each on
# its own runner with its own build and servers. The final job, named `e2e`,
# passes only if every shard passed; it is the check devel's branch protection
# requires, so adding or removing shards needs no protection change. It also
# merges the shards' blob reports into one HTML report + results.json.

on:
  # No path filter on triggers (so the `e2e` check is always reported for
  # branch protection); the `changes` job decides whether the curated suite
  # runs. A skipped job counts as passing — unrelated PRs don't deadlock. A
  # manual run can't diff, so it falls through to running (smoke/full).

  # `feature/tutorials` deliberately does NOT gate here. This suite costs
  # ~17 min per run in CI and ~2.4 min locally -- the difference is almost all
  # PsyNeuLink install -- so a slice author runs it locally and CI runs it once,
  # at the PR from feature/tutorials into devel, against everything accumulated.
  # Actions spend on this account is capped with stop-usage on (#991).
  # The cheap tier (typecheck + vitest) still gates every slice.
  push:
    branches: [devel, devel-unsafe]
  pull_request:
    branches: [devel, devel-unsafe]
  workflow_dispatch:
    inputs:
      mode:
        description: "Test mode (manual runs)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          # The PR gate's @ci suite, on any branch (#295: e.g. to try a
          # deliberately failing spec without opening a PR).
          - ci

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hook-capable PsyNeuLink (PrincetonUniversity @ jonhanke-dev) — matches the
  # app and the other CI workflows, and the build the curated specs were
  # validated against.
  PSYNEULINK_GIT_REF: b0a750db14f0e18f13f4af6d4228e5824a7f2797
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.f.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          # #1012 taught us the filter has to cover what e2e *asserts on*, not
          # just what it is written in. A reference-model sidecar change skipped
          # e2e entirely, so a layout edit landed on devel having broken
          # stroop-lc-reference — invisible until the next frontend PR ran.
          PATTERN: '^(frontend/|backend/reference_models/|\.github/workflows/e2e\.yml)'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `github.sha` is the auto-generated merge commit, and its FIRST
            # parent is the base branch as it stands *now*. Use that.
            #
            # `pull_request.base.sha` is the base as it was when the PR was
            # opened, so diffing from it also sweeps up everything the base
            # gained since -- #989. A one-line docs PR (#1184) ran tutorials,
            # e2e and both pytest variants because devel had moved under it:
            # the diff reported five frontend/workflow files the PR never
            # touched. The merge-base call below cannot save us there, because
            # the merge commit descends from the stale base, so the merge base
            # *is* the stale base.
            base="$(git rev-parse "${{ github.sha }}^1" 2>/dev/null || true)"
            # An unmergeable PR has no merge commit -> fall back to the
            # recorded base rather than skipping.
            [ -n "$base" ] || base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif mb="$(git merge-base "$base" "${{ github.sha }}" 2>/dev/null)"; [ -z "$mb" ]; then
            # merge base unresolvable -> fail safe by running, never by skipping
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$mb" "${{ github.sha }}" | grep -qE "$PATTERN"; then
            # #299: a release's version bump changes only version lines, and
            # devel already passed this job on the same code, so skip it. The
            # rule lives in scripts/version_only_diff.py; it exits 0 only for
            # a pure bump, so any other change, or any error, still runs.
            if python3 scripts/version_only_diff.py "$mb" "${{ github.sha }}"; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  shard:
    # Not `e2e`: that name belongs to the summary job below, the required check.
    name: e2e shard ${{ matrix.shard }}/3
    needs: changes
    # #991: `!= 'false'` rather than `== 'true'`, so this gate only skips when
    # `changes` actually decided the paths were irrelevant. If `changes` dies
    # (it failed to even start during the 2026-08-25 Actions billing outage),
    # `run` is empty and this job runs — and a required check that fails blocks
    # the merge, where a skipped one silently satisfies branch protection.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # The @ci suite alone had grown to about 29 minutes of a 30-minute job
    # (devel, 2026-10-24), so the next spec added tipped it over (#34). 45 then
    # ran out too: 9 minutes of setup plus 39 of tests (devel, 2026-11-04). 60
    # ran out the same day: about 10 of setup plus 50 of tests. 75 then
    # ran out with no test failing (#295), so the suite is now split across
    # runners; 75 stays per shard as a safety net, against ~25 minutes each.
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      # Let every shard finish: one failing shard must not cancel the others,
      # or the merged report would hide whatever else broke.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PsyNeuLink pulls torch, whose default wheel bundles multi-GB CUDA
      # libraries that exhaust the runner's root disk ([Errno 28]).
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        # #1368: no `cache: pip`. PsyNeuLink pulls torch and its CUDA wheels, so
        # the pip cache is ~2.8 GB, and its key (a hash of pyproject.toml) moves
        # with every version bump, so each PR saved another copy. Three of them
        # filled the repo's 10 GB Actions cache and evicted the Playwright browser
        # cache. Restoring it already took 30-60 s a job, so downloading the
        # wheels instead should cost little. See docs/testing.md.
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The environment comes from backend/uv.lock (#247): every package at
      # exactly the lock's version, except PsyNeuLink, which goes in on top
      # from the commit pinned as PSYNEULINK_GIT_REF, the way the Mac app puts
      # a user's chosen source on top. --frozen fails rather than re-resolve.
      # No uv cache, for the reason setup-python has none (#1368).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          enable-cache: false

      - name: Install backend from the lock
        working-directory: backend
        run: |
          uv sync --frozen --no-install-package psyneulink --python "$(command -v python)"
          uv pip install --python .venv/bin/python "git+https://github.com/PrincetonUniversity/PsyNeuLink.git@${PSYNEULINK_GIT_REF}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # #931: the browser install used to hang on apt and burn the whole job
      # timeout. System deps (apt) and the browser download are now separate
      # steps, each bounded per attempt and retried; a cache hit skips only
      # the download. apt gets network timeouts so a stalled mirror errors out
      # instead of hanging.
      - name: Restore Playwright browsers cache
        id: pw-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # #59: the packages install-deps downloads are kept between runs, so a
      # slow Ubuntu mirror costs nothing on a cache hit. apt writes them to a
      # folder the cache action can read (the default is root-only).
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/apt-archives
          key: apt-archives-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright system deps (bounded, retried)
        working-directory: frontend
        timeout-minutes: 12
        run: |
          # #59: apt waits up to 60 s for the dpkg lock instead of failing at
          # once, and keeps downloaded packages in the cached folder.
          mkdir -p "$HOME/.cache/apt-archives/partial"
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "60";\nDir::Cache::Archives "%s/.cache/apt-archives/";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network-timeouts
          for attempt in 1 2; do
            timeout --kill-after=15 300 npx playwright install-deps chromium && exit 0
            echo "::warning::Playwright install-deps attempt $attempt failed or timed out"
            # #59: timeout stops npx, but the apt-get it started under sudo
            # keeps running and holds the dpkg lock, so the retry could never
            # install. Stop it before retrying.
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sudo dpkg --configure -a || true
          done
          exit 1

      # Saved even when the install failed: each attempt's downloads still
      # count, so the next run starts further along. apt wrote them as root;
      # hand them back so the cache action can read them.
      - name: Make apt's downloads readable for the cache
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives" || true

      - name: Save apt package cache
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/apt-archives
          key: apt-archives-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Download Playwright browsers (bounded, retried)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=15 120 npx playwright install chromium && exit 0
            echo "::warning::Playwright browser download attempt $attempt failed or timed out"
          done
          exit 1

      # Saved straight after the download, not in a post-job step, so a job
      # that later fails or is cancelled still leaves the cache for next time.
      - name: Save Playwright browsers cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Playwright splits the selected tests into 3 contiguous runs of whole
      # spec files, by test count (workers: 1, fullyParallel: false). Measured
      # against a full @ci run (2026-11-18) that comes to ~21 / 21 / 24 minutes
      # of tests; see docs/testing.md before reaching for hand-balancing.
      # Each shard builds the frontend itself (~30 s): cheaper and simpler
      # than handing dist/ between jobs, which the stale-dist check would
      # also have to trust.
      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        working-directory: frontend
        env:
          SHARD_ARGS: --shard=${{ matrix.shard }}/3 --reporter=github,blob
        run: |
          mode="ci"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          fi
          case "$mode" in
            full)  npm run test:e2e -- $SHARD_ARGS ;;
            # A small set can leave a shard empty; that is not a failure.
            smoke) npm run test:e2e:smoke -- $SHARD_ARGS --pass-with-no-tests ;;
            # The curated green non-tutorial specs, tagged @ci (#168 increment).
            *)     npm run test:e2e:ci -- $SHARD_ARGS ;;
          esac

      # The blob report carries results, traces, videos and screenshots; the
      # `e2e` job merges the three. Kept briefly: the merged report is the one
      # to download.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  # The required check. Passes only when every shard passed, or when `changes`
  # decided the suite needn't run (shards skipped, as the single job used to be).
  e2e:
    name: e2e
    needs: [changes, shard]
    # Runs even when a shard failed or timed out, so the check reports red
    # rather than skipped (a skipped required check counts as passing).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Did every shard pass?
        id: verdict
        env:
          SHARDS: ${{ needs.shard.result }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "shards: $SHARDS (changes said run=$RUN)"
          if [ "$SHARDS" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$SHARDS" = "skipped" ] && [ "$RUN" = "false" ]; then
            echo "Nothing e2e covers changed; the suite was skipped."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.verdict.outputs.skipped != 'true'
        uses: actions/checkout@v5

      - name: Set up Node
        if: steps.verdict.outputs.skipped != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.verdict.outputs.skipped != 'true'
        working-directory: frontend
        run: npm ci

      - name: Download the shards' blob reports
        if: steps.verdict.outputs.skipped != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      # One HTML report and one results.json for the whole run, so a failure
      # is investigated in one place, and per-spec timings are on hand when
      # the shards need rebalancing. No --config: merge-reports then loads
      # none, so the stale-dist check in playwright.config.ts doesn't apply.
      - name: Merge reports
        id: merge
        if: steps.verdict.outputs.skipped != 'true' && hashFiles('frontend/all-blob-reports/*.zip') != ''
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          ls -l all-blob-reports
          npx playwright merge-reports --reporter=html,json ./all-blob-reports
          mv results.json playwright-report/results.json

      - name: Upload merged Playwright report
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: ${{ steps.verdict.outputs.ok == 'true' && 3 || 14 }}
          if-no-files-found: ignore

      - name: Verdict
        run: |
          if [ "${{ steps.verdict.outputs.ok }}" != "true" ]; then
            echo "::error::At least one e2e shard did not pass (${{ needs.shard.result }}). The merged report is the playwright-results-${{ github.run_id }} artifact."
            exit 1
          fi
