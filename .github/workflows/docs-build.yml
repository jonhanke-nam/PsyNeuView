name: Docs build

# Build-only check for the MkDocs site (#740): builds in --strict mode so a
# broken link or missing nav page fails the check. It does NOT publish anywhere
# (no GitHub Pages) — publishing is a separate, deferred decision (#740).
#
# Lightweight + path-filtered: runs only when docs change, installs just
# mkdocs-material (no PsyNeuLink/torch), and finishes in seconds. This is
# independent of the heavy e2e suite governed by #168.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "Makefile"
      - "backend/reference_models/**"
      - "scripts/docs_surface_check.py"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site (strict — fails on broken links / nav)
        run: mkdocs build --strict

      # #826: the other half of docs health. The strict build catches broken
      # links; this catches surfaces that were never documented at all — a make
      # target with help text and no README row, a reference model with no page,
      # a tutorial naming a model it never links. Nothing contradicts anything
      # in those cases, so no link check can see them.
      - name: Surface coverage (undocumented surfaces)
        run: python3 scripts/docs_surface_check.py
