id: pnl-pretrained-stroop
title: The pre-trained Stroop model — Cohen, Dunbar and McClelland (1990)
model: Pretrained Stroop
psyneulink: 5
minutes: 6
docs:
  - tutorials/02-running-a-model.md
  - tutorials/17-psyneulink-tutorials.md

# Lesson 5 of the PsyNeuLink Tutorials (#9): the Tutorial notebook's
# "Pre-trained Complete Stroop Model".
#
# Source: PsyNeuLink's tutorial/PsyNeuLink Tutorial.ipynb, cells 39-43.
# Validated against PsyNeuLink 0.20.2.0.
#
# The demo is the notebook's code and names: Ink_Color, Word and Task (two
# units each, Linear) into a four-unit Hidden layer (Logistic, bias -4: two
# units for the ink, two for the word) into Output (two units, Linear), with
# the learned weights written in. See backend/demos/pretrained_stroop.py.
#
# The notebook's text says the color task is [0, 1] and word reading [1, 0];
# in its own weights it is the other way round (task row 0 feeds the color
# units), so the lesson follows the weights: Task [1, 0] names the ink.
# Every number below was measured in the app;
# backend/tests/test_demo_pretrained_stroop.py and the tutorial spec pin them.
#
# What stays in the notebook: show_graph and reportOutputPref. The last step
# says so.

steps:
  - id: open-the-demo
    anchor:
      testid: open-menu
    instruct: >-
      Open the Pretrained Stroop demo. It is the notebook's version of Cohen,
      Dunbar and McClelland's 1990 Stroop model, with the weights the network
      would have learned written in.
    say: >-
      Open the Pretrained Stroop demo.
    done:
      nodeExists: Hidden
    act:
      openModel: Pretrained Stroop

  - id: the-hidden-layer
    anchor:
      node: Hidden
    instruct: >-
      Select Hidden. Its four units are two pairs: the first two carry the
      ink color, the last two the word. Its Logistic has a bias of -4, so a
      pair stays nearly off unless Task turns it on.
    say: >-
      The hidden layer: one pair of units for the ink, one for the word.
    done:
      selectedNode: Hidden
    act:
      selectNode: Hidden

  - id: the-word-weights
    anchor:
      testid: rf__edge-MappingProjection from Word[RESULT] to Hidden[InputPort-0]
    instruct: >-
      Click the arrow from Word to Hidden. Its matrix, [[0, 0, 2.6, -2.6],
      [0, 0, -2.6, 2.6]], reaches only the word pair, with weights of 2.6;
      the ink's reach its pair with 2.2. Reading is the more practised skill,
      so its weights are stronger, and its pair sends 2.5 on to Output where
      the ink's sends 1.3.
    say: >-
      Click the word arrow. Its weights are stronger than the ink's.
    done:
      selectedNode: MappingProjection from Word[RESULT] to Hidden[InputPort-0]
    act:
      selectNode: MappingProjection from Word[RESULT] to Hidden[InputPort-0]

  - id: run-the-notebook
    anchor:
      testid: tab-run
    instruct: >-
      In the Run tab, the demo opens with the notebook's input,
      notebook_input: red ink, the word blue, and Task [1, 0], name the ink.
      Run it. Output is [0.55, -0.55]: red, the right answer, but weakly,
      because the word pulls the other way.
    say: >-
      Run the notebook's input. The answer is red, but only weakly.
    done:
      lastRunInputs:
        Ink_Color: [[1, 0]]
        Word: [[0, 1]]
        Task: [[1, 0]]
    act:
      pickSet:
        tab: run
        name: notebook_input
      runModel: true

  - id: all-eight
    anchor:
      testid: tab-run
    instruct: >-
      The notebook asks you to try all eight combinations. From the From
      menu, pick all_eight and run it: the first four trials name the ink,
      the last four read the word. Naming the ink, a word that agrees gives
      1.53 and one that disagrees only 0.55. Reading the word, an agreeing
      ink gives 2.34 and a disagreeing one 1.97: the ink barely matters.
      The word gets in the way of the ink, and not the reverse: the Stroop
      effect.
    say: >-
      Run all eight. The word gets in the way of naming the ink, but the ink
      hardly affects reading.
    done:
      trialsAtLeast: 8
    act:
      pickSet:
        tab: run
        name: all_eight
      runModel: true

  - id: what-is-not-here
    anchor:
      testid: run-panel
    instruct: >-
      What this isn't: the notebook draws the model with show_graph, which
      is the canvas, and prints each mechanism's output with
      reportOutputPref, which the Run tab's results and trace stand in for.
      Next, the notebook's last section: constructing compositions, lesson 6.
    say: >-
      Next, building compositions of different shapes.
    done:
      next: true
    act:
      next: true
