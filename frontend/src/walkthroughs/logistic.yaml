id: logistic
title: The logistic function
course: "0.2"
# No `model:` — this walkthrough creates its own.

# Module 0 of the Cognitive Neuroscience Course, "Logistic Function" (#46).
# Built rather than opened: the New Model starter is already the right shape
# (input_node -> output_node), so the learner only has to change what the
# output node computes.
#
# The notebook's Exercise 1 asks for settings that make the output 1 when the
# input is 1, and answers bias = 1, offset = 0.5. That answer follows a formula
# that *subtracts* the bias. PsyNeuLink's Logistic *adds* it —
#   scale / (1 + e^(-gain * (variable + bias - x_0))) + offset
# — so in PsyNeuLink those settings give 1.38. The horizontal shift the
# notebook means is x_0. Every number below was measured in the app.

steps:
  - id: start-a-new-model
    anchor:
      testid: open-menu
    instruct: >-
      Start a new model: Open ▾ → + New Model…, and call it logistic_demo.
      It comes with two nodes, input_node feeding output_node.
    done:
      nodeExists: output_node
    act:
      newModel: logistic_demo

  - id: select-output
    anchor:
      node: output_node
    instruct: >-
      Select output_node. Its function is Linear, so for now it passes its
      input straight through.
    done:
      selectedNode: output_node
    act:
      selectNode: output_node

  - id: make-it-logistic
    anchor:
      node: output_node
    instruct: >-
      In the Inspector, change output_node's Function from Linear to Logistic:
      an S-shaped curve that squashes any input into the range 0 to 1.
    done:
      functionIs:
        node: output_node
        type: Logistic
    act:
      setFunction:
        node: output_node
        type: Logistic

  - id: run-it
    anchor:
      testid: tab-run
    instruct: >-
      Run it with the default inputs (1 on every trial). The Logistic turns an
      input of 1 into about 0.73: past the curve's midpoint of 0.5, but short
      of its ceiling.
    done:
      trialsAtLeast: 1
    act:
      runModel: true

  - id: shift-the-curve
    anchor:
      node: output_node
    instruct: >-
      The course's exercise: make the output exactly 1 when the input is 1.
      First move the curve's midpoint right to 1 by setting x_0 to 1. (The
      course notebook uses bias for this, but PsyNeuLink adds bias to the
      input, so x_0 is the shift.)
    done:
      paramEquals:
        node: output_node
        param: x_0
        value: "1"
    act:
      setParameter:
        node: output_node
        param: x_0
        value: "1"

  - id: lift-the-curve
    anchor:
      node: output_node
    instruct: >-
      An input of 1 now sits at the midpoint and gives 0.5. Lift the whole
      curve by setting offset to 0.5.
    done:
      paramEquals:
        node: output_node
        param: offset
        value: "0.5"
    act:
      setParameter:
        node: output_node
        param: offset
        value: "0.5"

  - id: run-again
    anchor:
      testid: tab-run
    instruct: >-
      Run it again. The output is now exactly 1.
    done:
      runsAtLeast: 2
    act:
      runModel: true
