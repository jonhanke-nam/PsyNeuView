id: pnl-dynamics-of-execution
title: Dynamics of execution — time scales and conditions
model: Dynamics of Execution
psyneulink: 9
minutes: 9
docs:
  - tutorials/02-running-a-model.md
  - tutorials/17-psyneulink-tutorials.md

# Lesson 9 of the PsyNeuLink Tutorials (#9): the Basics and Primer's
# "Dynamics of Execution".
#
# Source: PsyNeuLink's docs/source/BasicsAndPrimer.rst,
#   https://princetonuniversity.github.io/PsyNeuLink/BasicsAndPrimer.html
#   (Dynamics of Execution).
# Validated against PsyNeuLink 0.20.2.0.
#
# The demo is lesson 8's Stroop model with the Primer's changed decision: a
# DriftDiffusionIntegrator (noise 0.5, threshold 20), reset at the start of
# each trial, and a trial that ends when the decision is finished. The
# Primer passes that as termination_processing to run(); a model file has
# no run() call, so the demo sets the scheduler's termination_conds, which
# the Scheduler tab shows (TimeScale.TRIAL is now named
# ENVIRONMENT_STATE_UPDATE). See backend/demos/dynamics_of_execution.py.
#
# With noise, the number of steps changes from run to run, as the Primer
# says, so the lesson then sets noise to 0.0 to get numbers it can quote:
# 59 steps for the incongruent trial, 25 for the congruent one. Then the
# Primer's scheduler example: TASK INPUT becomes an LCAMechanism, and the
# hidden layers run only after every 10 executions of it. The Primer names
# the condition EveryNExecutions, which PsyNeuLink no longer has; it is
# EveryNCalls. With it the task unit settles to 0.61 against 0.39, too weak
# an instruction: the incongruent trial answers green, -20, in 57 steps.
# The Primer prints [20, 126] and [20, 42], from an older PsyNeuLink and
# with noise. Every number below was measured in the app;
# backend/tests/test_demo_dynamics_of_execution.py and the tutorial spec pin
# them.
#
# What stays in the Primer: the converge function and its When condition,
# and the list of pre-defined Conditions. The last step says so.

steps:
  - id: open-the-demo
    anchor:
      testid: open-menu
    instruct: >-
      Open the Dynamics of Execution demo. It is the Stroop model from lesson
      8, with the decision changed as the Primer changes it, to show what
      happens inside a trial.
    say: >-
      Open the Dynamics of Execution demo: the Stroop model, with a new
      decision.
    done:
      nodeExists: DECISION
    act:
      openModel: Dynamics of Execution

  - id: the-integrator
    anchor:
      node: DECISION
    instruct: >-
      Select DECISION. Its function is now DriftDiffusionIntegrator, with
      noise 0.5 and threshold 20. In lesson 8 the decision was computed in
      one go; this one adds up the evidence one step at a time, with noise,
      until it reaches +20 for red or -20 for green. It reports where it
      stopped and how many steps that took. Every other mechanism finishes
      in a single execution: the model now runs on two time scales.
    say: >-
      The decision now adds up evidence step by step, until it reaches a
      threshold of 20.
    done:
      selectedNode: DECISION
    act:
      selectNode: DECISION

  - id: when-a-trial-ends
    anchor:
      testid: tab-scheduler
    instruct: >-
      Click Scheduler. Under termination conditions, the trial (shown as
      ENVIRONMENT_STATE_UPDATE, PsyNeuLink's newer name for a trial) ends
      WhenFinished(DECISION): when the decision has reached its threshold.
      The Primer writes this as termination_processing in its call to run.
    say: >-
      The Scheduler tab: a trial ends when the decision is finished.
    done:
      visible: panel-scheduler
    act:
      click: tab-scheduler

  - id: run-with-noise
    anchor:
      testid: tab-run
    instruct: >-
      In the Run tab, the demo opens with the Primer's trial, primer_trial:
      red ink, the word green, and the color task. Press Run Model. DECISION
      stops at 20, red, after some tens of steps. Because of the noise, the
      count changes each time you run it; the Primer notes the same.
    say: >-
      Run the Primer's trial. The decision reaches 20 after some tens of
      steps, a different number each time.
    done:
      lastRunInputs:
        COLOR INPUT: [[1, 0]]
        WORD INPUT: [[0, 1]]
        TASK INPUT: [[1, 0]]
    act:
      pickSet:
        tab: run
        name: primer_trial
      runModel: true

  - id: no-noise
    anchor:
      testid: code-editor-pane
    instruct: >-
      To get numbers that stay put, turn the noise off. In the code, change
      noise=0.5 to noise=0.0, in DECISION's DriftDiffusionIntegrator.
    say: >-
      Turn the noise off, so the numbers stay put.
    done:
      paramEquals:
        node: DECISION
        param: noise
        value: "0"
    act:
      replaceInCode:
        find: "noise=0.5"
        replace: "noise=0.0"

  - id: run-incongruent
    anchor:
      testid: tab-run
    instruct: >-
      Run the same trial again. Now it takes 59 steps to reach 20, every
      time.
    say: >-
      Run it again: 59 steps, every time.
    done:
      runsAtLeast: 2
    act:
      pickSet:
        tab: run
        name: primer_trial
      runModel: true

  - id: run-congruent
    anchor:
      testid: tab-run
    instruct: >-
      Now the congruent trial: give WORD INPUT [1, 0], the word red, and run
      it. 25 steps. The word that agrees with the ink speeds the decision up;
      the one that disagrees slows it down, 59 against 25: the Stroop effect,
      counted in steps.
    say: >-
      Run the congruent trial: 25 steps, against 59.
    done:
      lastRunInputs:
        COLOR INPUT: [[1, 0]]
        WORD INPUT: [[1, 0]]
        TASK INPUT: [[1, 0]]
    act:
      setTrialInputs:
        COLOR INPUT: [[1, 0]]
        WORD INPUT: [[1, 0]]
        TASK INPUT: [[1, 0]]
      runModel: true

  - id: a-settling-task
    anchor:
      testid: code-editor-pane
    instruct: >-
      The Primer's next example times one mechanism against others. First,
      make the task a leaky competing accumulator, which settles over many
      executions: in the code, change TASK INPUT's pnl.ProcessingMechanism to
      pnl.LCAMechanism. Its two units now compete, each holding the other
      down.
    say: >-
      Make the task input a leaky competing accumulator, which settles over
      time.
    done:
      paramEquals:
        node: TASK INPUT
        param: leak
        value: "0.5"
    act:
      replaceInCode:
        find: "task_input = pnl.ProcessingMechanism(name='TASK INPUT', input_shapes=2)"
        replace: "task_input = pnl.LCAMechanism(name='TASK INPUT', input_shapes=2)"

  - id: wait-for-the-task
    anchor:
      testid: code-editor-pane
    instruct: >-
      Now the conditions. Above the termination line, add
      Stroop_model.scheduler.add_condition(color_hidden,
      pnl.EveryNCalls(task_input, 10)), and the same for word_hidden: the
      hidden layers run only after every 10 executions of the task, so the
      instruction is processed before the stimuli. (The Primer calls this
      condition EveryNExecutions; it is now EveryNCalls.) Then run the
      Primer's trial again, from primer_trial.
    say: >-
      Make the hidden layers wait for 10 executions of the task, and run the
      Primer's trial again.
    done:
      lastRunInputs:
        COLOR INPUT: [[1, 0]]
        WORD INPUT: [[0, 1]]
        TASK INPUT: [[1, 0]]
    act:
      replaceInCode:
        find: "# A trial ends when the decision is finished."
        replace: "Stroop_model.scheduler.add_condition(color_hidden, pnl.EveryNCalls(task_input, 10))\nStroop_model.scheduler.add_condition(word_hidden, pnl.EveryNCalls(task_input, 10))\n# A trial ends when the decision is finished."
      pickSet:
        tab: run
        name: primer_trial
      runModel: true

  - id: the-word-wins
    anchor:
      testid: tab-run
    instruct: >-
      The answer is now -20, green, after 57 steps. After its 10 executions,
      the task unit's competition has left it at 0.61 for color and 0.39 for
      word, not 1 and 0: a weaker instruction, and the stronger word pathway
      wins. Timing changed what the model does, not just how long it takes.
    say: >-
      Now the word wins: the answer is green. The settled instruction was
      too weak.
    done:
      next: true
    act:
      next: true

  - id: what-is-not-here
    anchor:
      testid: run-panel
    instruct: >-
      What this isn't: the Primer also lets the hidden layers wait until the
      task has settled, with a converge function and a When condition, rather
      than for a fixed count, and lists PsyNeuLink's pre-defined Conditions.
      Its printed results, [20, 126] and [20, 42], come from an older
      PsyNeuLink, with noise. Next in the Primer is Control, lesson 10.
    say: >-
      Waiting for the task to settle, rather than a fixed count, stays in the
      Primer.
    done:
      next: true
    act:
      next: true
