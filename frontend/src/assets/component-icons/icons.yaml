# Components panel icons (#283): which icon each palette item uses, and
# where each drawing came from. docs/icon-ontology.md says how they are
# drawn; componentIcons.test.ts checks every palette item has one here.
#
#   source: metacell  - adapted from MetaCell's PsyNeuLinkView, used with
#                       permission (metacell_path is the file in that repo,
#                       under src/client/assets/svg/). Only the path data is
#                       kept; colour comes from the panel (currentColor).
#   source: original  - drawn for PsyNeuView. based_on names a MetaCell
#                       drawing it reuses part of.
#   tint              - a colour token used instead of the item's type colour.

categories:
  mechanisms:
    file: processing-mechanism.svg
    source: metacell
    metacell_path: src/client/assets/svg/node/gray.svg
    meaning: "MetaCell's node: the plain mechanism, a ring with a core"
  projections:
    file: mapping-projection.svg
    source: metacell
    metacell_path: src/client/assets/svg/node/composition.svg
    meaning: "MetaCell's link between two nodes, turned to run bottom to top"
  compositions:
    file: composition.svg
    source: original
    based_on: src/client/assets/svg/comp.svg
    meaning: "MetaCell's dashed boundary around a small graph"
  functions:
    file: functions.svg
    source: original
    meaning: "an italic f: a function"
  ports:
    file: ports.svg
    source: original
    meaning: "a node with a port on each edge"

